<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sphere 3D RVE Generator</title>
    <link rel="stylesheet" href="./taskpane.css?v=20260515-3d-rve" />
  </head>
  <body>
    <main class="app">
      <section class="controls">
        <label><span>RVE宽度 X (um)</span><input id="width" type="number" min="1" step="1" value="40" /></label>
        <label><span>RVE高度 Y (um)</span><input id="height" type="number" min="1" step="1" value="40" /></label>
        <label><span>RVE深度 Z (um)</span><input id="depth" type="number" min="1" step="1" value="40" /></label>
        <label><span>泡孔数量</span><input id="cellCount" type="number" min="4" max="600" step="1" value="80" /></label>
        <label><span>泡孔直径 (um)</span><input id="poreDiameter" type="number" min="0.1" step="0.1" value="10" /></label>
        <label><span>壁厚 (um)</span><input id="wallThickness" type="number" min="0" step="0.1" value="1" /></label>
        <label>
          <span>结构均匀度</span>
          <select id="uniformity">
            <option value="random" selected>随机</option>
            <option value="uniform">均匀</option>
            <option value="clustered">不均匀</option>
          </select>
        </label>
        <label><span>目标变异系数</span><input id="targetCv" type="number" min="0.05" max="1.5" step="0.01" value="0.60" /></label>
        <label><span>团聚区数量</span><input id="clusterCount" type="number" min="0" max="80" step="1" value="4" /></label>
        <label><span>每个团聚区泡孔数</span><input id="poresPerCluster" type="number" min="0" max="300" step="1" value="8" /></label>
        <label><span>团聚区目标变异系数</span><input id="clusterCv" type="number" min="0.05" max="1.5" step="0.01" value="0.85" /></label>
        <label><span>表面分辨率</span><input id="surfaceResolution" type="number" min="5" max="32" step="1" value="12" /></label>
        <label><span>随机种子</span><input id="seed" type="number" step="1" value="42" /></label>
        <label class="color-field"><span>背景颜色</span><input id="bgColor" type="color" value="#f7f8fb" /></label>
        <label class="color-field"><span>RVE边框颜色</span><input id="boxColor" type="color" value="#263238" /></label>
        <label class="color-field"><span>RVE内部颜色</span><input id="rveFillColor" type="color" value="#d8e3e6" /></label>
        <label class="color-field"><span>泡孔表面颜色</span><input id="poreColor" type="color" value="#2aa198" /></label>
        <label class="color-field"><span>泡孔线框颜色</span><input id="wireColor" type="color" value="#0e4f55" /></label>
        <label><span>泡孔线框粗细</span><input id="wireThickness" type="number" min="0" max="5" step="0.1" value="0" /></label>
        <label><span>泡孔透明度</span><input id="poreOpacity" type="number" min="0" max="1" step="0.05" value="0.58" /></label>
        <div class="actions">
          <button id="generate" type="button">生成预览</button>
          <button id="downloadStl" type="button">下载STL</button>
          <button id="downloadObj" type="button">下载OBJ</button>
          <button id="downloadNodes" type="button">下载节点CSV</button>
          <button id="downloadEdges" type="button">下载连线CSV</button>
          <button id="downloadFaces" type="button">下载面片CSV</button>
        </div>
      </section>
      <section class="viewer-wrap">
        <div id="viewer" class="viewer"></div>
      </section>
      <section id="metrics" class="metrics"></section>
    </main>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
        }
      }
    </script>
    <script type="module" src="./taskpane.js?v=20260515-3d-rve"></script>
  </body>
</html>
